name: Add Empirical glossary entry

on:
  push:
    branches: [feat/beginner-vowel-compare-ui]
    paths:
      - 'tools/add_empirical_glossary_entry.py'
      - '.github/workflows/add-empirical-glossary-entry.yml'

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Add Empirical glossary entry
        run: python tools/add_empirical_glossary_entry.py
      - name: Validate JavaScript and content
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'data-learn-topic="empirical"' in html
          assert 'Empirical（実測・観測に基づく）' in html
          assert '万人にとって唯一の正解' in html
          assert 'https://doi.org/10.17226/10236' in html
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,flags=re.S)
          Path('/tmp/formantasia.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/formantasia.js
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Browser smoke test
        run: |
          python -m http.server 8000 >/tmp/formantasia-server.log 2>&1 &
          sleep 1
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1280,1000')
          opts.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=opts); w=WebDriverWait(d,20)
          try:
              d.get('http://127.0.0.1:8000/')
              d.find_element('id','learningModeBtn').click()
              btn=d.find_element('css selector','.learning-topic[data-learn-topic="empirical"]')
              btn.click()
              w.until(lambda x:'Empirical' in d.find_element('id','learningExplainTitle').get_attribute('textContent'))
              one=d.find_element('id','learningExplainText').get_attribute('textContent')
              precise=d.find_element('id','learningExplainPrecise').get_attribute('textContent')
              refs=d.find_element('id','learningExplainSources')
              print('EMPIRICAL_ONE',one)
              print('EMPIRICAL_PRECISE',precise)
              assert '観察・測定' in one
              assert '群平均' in precise and '唯一の正解' in precise
              assert len(refs.find_elements('css selector','a'))==1
              assert 'National Research Council' in refs.get_attribute('textContent')
              severe=[x for x in d.get_log('browser') if x.get('level')=='SEVERE' and 'favicon.ico' not in x.get('message','')]
              print('FINAL_SEVERE_BROWSER_LOGS',severe)
              assert not severe,severe
              print('EMPIRICAL_GLOSSARY_OK')
          finally:
              d.quit()
          PY
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No generated index changes.'
          else
            git commit -m 'Add Empirical to sourced glossary'
            git push
          fi
