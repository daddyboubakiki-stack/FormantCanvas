name: Improve learning popover accessibility

on:
  push:
    branches: [main]
    paths:
      - 'tools/improve_learning_popover_accessibility.py'
      - '.github/workflows/improve-learning-popover-accessibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply popover accessibility patch
        run: python tools/improve_learning_popover_accessibility.py

      - name: Validate generated markup and JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'LEARNING_POPOVER_MS' not in html
          assert 'learningPopoverTimer' not in html
          assert "setAttribute('role','dialog')" in html
          assert "setAttribute('aria-modal','false')" in html
          assert 'class="learning-popover-close"' in html
          assert 'aria-label="閉じる"' in html
          assert 'learningInfoPopover.hidden=true' in html
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S)
          Path('/tmp/formantasia.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/formantasia.js

      - name: Install Selenium
        run: python -m pip install --quiet selenium

      - name: Browser popover smoke test
        run: |
          python -m http.server 8000 >/tmp/formantasia-server.log 2>&1 &
          sleep 1
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1280,1000')
          opts.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          wait=WebDriverWait(driver,20)
          try:
              driver.get('http://127.0.0.1:8000/')
              driver.find_element('id','learningModeBtn').click()
              info=driver.find_element('css selector','.info-dot[data-learn-topic="f0"]')
              info.click()
              pop=driver.find_element('id','learningInfoPopover')
              wait.until(lambda d: pop.get_attribute('hidden') is None and 'visible' in pop.get_attribute('class'))
              assert pop.get_attribute('role')=='dialog'
              close=driver.find_element('css selector','.learning-popover-close')
              assert close.get_attribute('aria-label')=='閉じる'
              wait.until(lambda d: d.switch_to.active_element == close)
              close.click()
              wait.until(lambda d: pop.get_attribute('hidden') is not None)
              assert info.get_attribute('aria-expanded')=='false'
              assert driver.switch_to.active_element == info

              info.click()
              wait.until(lambda d: pop.get_attribute('hidden') is None)
              driver.switch_to.active_element.send_keys(Keys.ESCAPE)
              wait.until(lambda d: pop.get_attribute('hidden') is not None)
              assert driver.switch_to.active_element == info

              severe=[x for x in driver.get_log('browser') if x.get('level')=='SEVERE' and 'favicon.ico' not in x.get('message','')]
              print('FINAL_SEVERE_BROWSER_LOGS',severe)
              assert not severe, severe
              print('LEARNING_POPOVER_ACCESSIBILITY_OK')
          finally:
              driver.quit()
          PY

      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No generated index changes.'
          else
            git commit -m 'Improve learning popover accessibility'
            git push
          fi
