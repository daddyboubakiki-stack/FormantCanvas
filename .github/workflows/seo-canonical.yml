name: Add canonical Formantasia URL

on:
  push:
    branches: [seo-canonical-formantasia]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-canonical-formantasia
      - name: Add canonical URL and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          url = 'https://formantasia.netlify.app/'
          p = Path('index.html')
          s = p.read_text()
          anchor = '<meta name="application-name" content="Formantasia" />'
          insert = anchor + '\n<link rel="canonical" href="' + url + '" />'
          if anchor not in s:
              raise SystemExit('application-name meta not found')
          s = s.replace(anchor, insert, 1)
          og_anchor = '<meta property="og:type" content="website" />'
          og_insert = og_anchor + '\n<meta property="og:url" content="' + url + '" />'
          if og_anchor not in s:
              raise SystemExit('og:type not found')
          s = s.replace(og_anchor, og_insert, 1)
          json_anchor = '  "operatingSystem": "Web",'
          json_insert = json_anchor + '\n  "url": "' + url + '",'
          if json_anchor not in s:
              raise SystemExit('JSON-LD operatingSystem not found')
          s = s.replace(json_anchor, json_insert, 1)
          p.write_text(s)

          r = Path('README.md')
          rs = r.read_text()
          marker = '**声をえがくキャンバス · Draw Your Voice**\n'
          linkline = marker + '\n**Live app:** ' + url + '\n'
          if marker not in rs:
              raise SystemExit('README tagline not found')
          rs = rs.replace(marker, linkline, 1)
          r.write_text(rs)

          Path('robots.txt').write_text('User-agent: *\nAllow: /\n\nSitemap: https://formantasia.netlify.app/sitemap.xml\n')
          Path('sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url>\n    <loc>https://formantasia.netlify.app/</loc>\n    <lastmod>2026-09-16</lastmod>\n    <changefreq>weekly</changefreq>\n  </url>\n</urlset>\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md robots.txt sitemap.xml
          git commit -m "Add canonical Formantasia URL and sitemap"
          git push
