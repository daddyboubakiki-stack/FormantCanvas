name: Casual child-friendly labels

on:
  push:
    branches: [casual-child-copy-20260917]
    paths:
      - '.github/workflows/casual-child-copy-20260917.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add casual-only child-friendly select labels
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'Casual child-friendly select labels — 2026-09-17'
          if marker in html:
              print('Patch already present.')
          else:
              script = dedent(r'''
              <script>
              /* Casual child-friendly select labels — 2026-09-17
                 Display-only wording: values, research data, and non-casual terminology stay unchanged. */
              (() => {
                const languageSelect = document.getElementById('presetLanguage');
                const voiceSelect = document.getElementById('voiceType');
                if (!languageSelect || !voiceSelect) return;

                const toCanonicalLanguage = (text) => text
                  .replace(/^にほんご/, '日本語')
                  .replace(/^えいご/, 'English');

                const toCasualLanguage = (text) => text
                  .replace(/^日本語/, 'にほんご')
                  .replace(/^English/, 'えいご');

                const toCanonicalVoice = (text) => text
                  .replace(/^おとな・男性/, '成人男性')
                  .replace(/^おとな・女性/, '成人女性');

                const toCasualVoice = (text) => text
                  .replace(/^成人男性/, 'おとな・男性')
                  .replace(/^成人女性/, 'おとな・女性');

                function rewriteOptions(select, canonicalize, casualize) {
                  const casual = document.body.dataset.uiMode === 'casual';
                  for (const option of select.options) {
                    const canonical = canonicalize(option.textContent || '');
                    const next = casual ? casualize(canonical) : canonical;
                    if (option.textContent !== next) option.textContent = next;
                  }
                }

                function applyCasualFriendlySelectLabels() {
                  rewriteOptions(languageSelect, toCanonicalLanguage, toCasualLanguage);
                  rewriteOptions(voiceSelect, toCanonicalVoice, toCasualVoice);
                }

                const optionObserver = new MutationObserver(() => applyCasualFriendlySelectLabels());
                optionObserver.observe(languageSelect, { childList:true, subtree:true, characterData:true });
                optionObserver.observe(voiceSelect, { childList:true, subtree:true, characterData:true });

                const modeObserver = new MutationObserver((records) => {
                  if (records.some(record => record.attributeName === 'data-ui-mode')) {
                    applyCasualFriendlySelectLabels();
                  }
                });
                modeObserver.observe(document.body, { attributes:true, attributeFilter:['data-ui-mode'] });

                applyCasualFriendlySelectLabels();
                requestAnimationFrame(applyCasualFriendlySelectLabels);
              })();
              </script>
              ''').strip() + '\n'
              if '</body>' not in html:
                  raise SystemExit('No </body> marker found')
              html = html.replace('</body>', script + '\n</body>', 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Static validation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'Casual child-friendly select labels — 2026-09-17' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          Path('/tmp/formantasia-last.js').write_text(scripts[-1], encoding='utf-8')
          print('STATIC_CHILD_COPY_OK')
          PY
          node --check /tmp/formantasia-last.js

      - name: Install Selenium
        run: python -m pip install --quiet selenium

      - name: Browser mode wording test
        run: |
          python -m http.server 8000 >/tmp/formantasia-child-copy.log 2>&1 &
          sleep 1
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          import time

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=390,844')
          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 20)
          try:
              driver.get('http://127.0.0.1:8000/')
              wait.until(lambda d: len(d.find_elements('css selector','#presetLanguage option')) >= 2)
              wait.until(lambda d: len(d.find_elements('css selector','#voiceType option')) >= 1)
              time.sleep(.3)

              def language_texts():
                  return [x.text for x in driver.find_elements('css selector','#presetLanguage option')]
              def voice_texts():
                  return [x.text for x in driver.find_elements('css selector','#voiceType option')]

              casual_lang = language_texts()
              casual_voice = voice_texts()
              print('CASUAL_LANG', casual_lang)
              print('CASUAL_VOICE', casual_voice)
              assert any(t.startswith('にほんご') for t in casual_lang), casual_lang
              assert any(t.startswith('えいご') for t in casual_lang), casual_lang
              assert any(t.startswith('おとな・男性') for t in casual_voice), casual_voice
              assert any(t.startswith('おとな・女性') for t in casual_voice), casual_voice

              driver.find_element('id','learningModeBtn').click()
              wait.until(lambda d: d.find_element('tag name','body').get_attribute('data-ui-mode') == 'learning')
              time.sleep(.2)
              learning_lang = language_texts()
              learning_voice = voice_texts()
              print('LEARNING_LANG', learning_lang)
              print('LEARNING_VOICE', learning_voice)
              assert any(t.startswith('日本語') for t in learning_lang), learning_lang
              assert any(t.startswith('English') for t in learning_lang), learning_lang
              assert any(t.startswith('成人男性') for t in learning_voice), learning_voice
              assert any(t.startswith('成人女性') for t in learning_voice), learning_voice
              assert not any(t.startswith('おとな・') for t in learning_voice), learning_voice

              driver.find_element('id','researchModeBtn').click()
              wait.until(lambda d: d.find_element('tag name','body').get_attribute('data-ui-mode') == 'research')
              time.sleep(.2)
              assert any(t.startswith('日本語') for t in language_texts()), language_texts()
              assert any(t.startswith('English') for t in language_texts()), language_texts()
              assert any(t.startswith('成人男性') for t in voice_texts()), voice_texts()

              driver.find_element('id','casualModeBtn').click()
              wait.until(lambda d: d.find_element('tag name','body').get_attribute('data-ui-mode') == 'casual')
              time.sleep(.2)
              assert any(t.startswith('にほんご') for t in language_texts()), language_texts()
              assert any(t.startswith('えいご') for t in language_texts()), language_texts()
              assert any(t.startswith('おとな・男性') for t in voice_texts()), voice_texts()
              print('CASUAL_CHILD_COPY_BROWSER_OK')
          finally:
              driver.quit()
          PY

      - name: Commit validated index and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use child-friendly labels in casual mode [skip netlify]'
          git rm .github/workflows/casual-child-copy-20260917.yml
          git commit -m 'Remove child-copy helper [skip netlify]'
          git push
