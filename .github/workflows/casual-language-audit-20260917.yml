name: Casual language audit

on:
  push:
    branches: [casual-language-audit-20260917]
    paths:
      - '.github/workflows/casual-language-audit-20260917.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Extract visible casual-mode copy
        run: |
          python -m http.server 8000 >/tmp/formantasia-language-audit.log 2>&1 &
          sleep 1
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          import time

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1280,1200')
          d = webdriver.Chrome(options=opts)
          wait = WebDriverWait(d, 20)
          try:
              d.get('http://127.0.0.1:8000/')
              wait.until(lambda x: len(x.find_elements('css selector','#vowelPreset option')) >= 5)
              d.find_element('id','casualModeBtn').click()
              wait.until(lambda x: x.find_element('tag name','body').get_attribute('data-ui-mode') == 'casual')
              time.sleep(.5)

              print('=== INITIAL_VISIBLE_TEXT ===')
              print(d.find_element('tag name','body').get_attribute('innerText'))

              print('\n=== SELECT_OPTIONS ===')
              for sid in ['presetLanguage','voiceType','vowelPreset']:
                  el = d.find_element('id', sid)
                  print(f'[{sid}]')
                  for opt in el.find_elements('tag name','option'):
                      print(opt.text)

              print('\n=== VISIBLE_BUTTONS ===')
              for btn in d.find_elements('tag name','button'):
                  if btn.is_displayed():
                      text = (btn.text or '').strip()
                      aria = btn.get_attribute('aria-label') or ''
                      title = btn.get_attribute('title') or ''
                      print(f'TEXT={text!r} ARIA={aria!r} TITLE={title!r}')

              print('\n=== OPENABLE_DETAILS_TEXT ===')
              for det in d.find_elements('tag name','details'):
                  if det.is_displayed():
                      d.execute_script('arguments[0].open = true;', det)
              time.sleep(.2)
              print(d.find_element('tag name','body').get_attribute('innerText'))

              print('\n=== EMPTY_CANVAS_VISIBLE_TEXT ===')
              clear = d.find_element('id','clearAll')
              if clear.is_displayed():
                  clear.click()
                  time.sleep(.2)
              print(d.find_element('tag name','body').get_attribute('innerText'))
          finally:
              d.quit()
          PY
      - name: Remove one-shot audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/casual-language-audit-20260917.yml
          git commit -m 'Remove casual language audit helper [skip netlify]'
          git push
