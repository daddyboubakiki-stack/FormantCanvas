# Runs the dependency-free spectrum X-ray checks on every PR and on main.
name: Spectrum X-ray tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Spectrum layer tests
        run: node tests/spectrum-layer.test.cjs
