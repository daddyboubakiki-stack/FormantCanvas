name: Dedupe learning popover sources

on:
  push:
    branches: [feat/beginner-vowel-compare-ui]
    paths:
      - 'tools/dedupe_learning_popover_sources.py'
      - '.github/workflows/dedupe-learning-popover-sources.yml'

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Deduplicate compact sources
        run: python tools/dedupe_learning_popover_sources.py
      - name: Validate and test
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'Compact glossary source dedupe v1' in html
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,flags=re.S)
          Path('/tmp/formantasia.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/formantasia.js
          python -m pip install --quiet selenium
          python -m http.server 8000 >/tmp/formantasia-server.log 2>&1 &
          sleep 1
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1280,1000')
          opts.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=opts); w=WebDriverWait(d,20)
          try:
              d.get('http://127.0.0.1:8000/')
              d.find_element('id','learningModeBtn').click()
              d.find_element('css selector','.info-dot[data-learn-topic="bandwidth"]').click()
              pop=d.find_element('id','learningInfoPopover')
              w.until(lambda x:'visible' in pop.get_attribute('class'))
              text=d.find_element('css selector','#learningInfoPopover .learning-popover-source').get_attribute('textContent')
              print('POPOVER_SOURCE',text)
              assert text.count('Praat Manual')==1
              d.find_element('css selector','.learning-topic[data-learn-topic="bandwidth"]').click()
              refs=d.find_element('id','learningExplainSources').find_elements('css selector','a')
              assert len(refs)==2
              severe=[x for x in d.get_log('browser') if x.get('level')=='SEVERE' and 'favicon.ico' not in x.get('message','')]
              assert not severe,severe
              print('POPOVER_SOURCE_DEDUPE_OK')
          finally:
              d.quit()
          PY
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No generated index changes.'
          else
            git commit -m 'Deduplicate compact glossary source labels'
            git push
          fi
