name: Fix learning display fragments

on:
  push:
    branches: [fix-learning-display-fragments]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-learning-display-fragments
      - name: Restore native display semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
            'body[data-ui-mode="casual"] .casual-only { display:initial; }':
            'body[data-ui-mode="casual"] .casual-only { display:revert; }',
            'body[data-ui-mode="learning"] .learning-only { display:initial; }':
            'body[data-ui-mode="learning"] .learning-only { display:revert; }',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected CSS not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore native display semantics for mode-specific content"
          git push
