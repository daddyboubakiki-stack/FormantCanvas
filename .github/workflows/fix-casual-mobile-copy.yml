name: Fix casual mobile copy

on:
  push:
    branches: [fix-casual-mobile-copy]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-casual-mobile-copy
      - name: Patch casual helper text and responsive styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
            '.casual-tip { margin-top:12px; padding:10px 13px; background:rgba(255,255,255,.75); border:1px dashed #d9deea; border-radius:14px; color:#697184; font-size:12px; text-align:center; }':
            '.casual-tip { margin:12px auto 0; padding:0 8px; max-width:760px; color:#697184; font-size:12px; line-height:1.7; text-align:center; overflow-wrap:break-word; }',
            '<p class="casual-only">線を描いて、声のひびきがどう変わるか聴いてみよう。むずかしい設定は隠してあります。</p>':
            '<p class="casual-only">線を描いて、声のひびきがどう変わるか聴いてみよう。</p>',
            '<div class="casual-tip casual-only">✏️ F1・F2・F3を好きに曲げて、右下の丸い ▶ で聴き比べよう。学習モードにするとF1/F2/F3や音のしくみを確かめられます。</div>':
            '<div class="casual-tip casual-only">✏️ F1・F2・F3を好きに曲げて、▶ で聴き比べよう。学習モードでは、F1/F2/F3や音のしくみも確かめられます。</div>'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish casual mode helper text on mobile"
          git push
