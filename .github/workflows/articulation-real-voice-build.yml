name: Articulation Lab real-voice bundle

on:
  workflow_dispatch:
  push:
    branches:
      - design/articulation-lab-v0.1
    paths:
      - 'articulation-lab/data/real-voice-sources.json'
      - 'articulation-lab/tools/build_real_voice_bundle.py'
      - '.github/workflows/articulation-real-voice-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/articulation-lab-v0.1

      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 --version
          ffmpeg -version | head -2

      - name: Download vetted source recordings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/articulation-voice-src
          commons='https://commons.wikimedia.org/wiki/Special:Redirect/file'
          curl -L --fail --retry 3 "$commons/Ja-A.oga" -o /tmp/articulation-voice-src/jp_a.ogg
          curl -L --fail --retry 3 "$commons/Japanese%20I.ogg" -o /tmp/articulation-voice-src/jp_i.ogg
          curl -L --fail --retry 3 "$commons/Japanese%20U.ogg" -o /tmp/articulation-voice-src/jp_u.ogg
          curl -L --fail --retry 3 "$commons/Ja-E.oga" -o /tmp/articulation-voice-src/jp_e.ogg
          curl -L --fail --retry 3 "$commons/Japanese%20O.ogg" -o /tmp/articulation-voice-src/jp_o.ogg
          curl -L --fail --retry 3 "$commons/All%20IPA%20Vowels.ogg" -o /tmp/articulation-voice-src/all_ipa.ogg
          curl -L --fail --retry 3 "$commons/En-us-kid.ogg" -o /tmp/articulation-voice-src/en_us_kid.ogg
          ls -lh /tmp/articulation-voice-src

      - name: Prepare raw IPA listening review
        run: |
          set -euxo pipefail
          mkdir -p /tmp/articulation-source-review
          cp /tmp/articulation-voice-src/all_ipa.ogg /tmp/articulation-source-review/All_IPA_Vowels_original.ogg
          cp /tmp/articulation-voice-src/en_us_kid.ogg /tmp/articulation-source-review/En-us-kid_original.ogg
          ffmpeg -hide_banner -loglevel error -y \
            -ss 5.59 -t 0.18 -i /tmp/articulation-voice-src/all_ipa.ogg \
            -ac 1 -ar 24000 -c:a pcm_s16le \
            /tmp/articulation-source-review/IPA_near_close_front_unrounded_original_segment.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/articulation-voice-src/en_us_kid.ogg \
            -ac 1 -ar 24000 -c:a pcm_s16le \
            /tmp/articulation-source-review/En-us-kid_full.wav
          printf '%s\n' \
            'Raw source review for app vowel /ɪ/.' \
            'IPA source: All IPA Vowels.ogg by 173 Ascension 257, CC0 1.0.' \
            'English-word candidate: En-us-kid.ogg by Dvortygirl, US English, CC BY-SA 2.5 / GFDL dual license.' \
            'No processing beyond decoding to mono 24 kHz PCM was applied to En-us-kid_full.wav.' \
            > /tmp/articulation-source-review/README.txt

      - name: Upload raw IPA listening review
        uses: actions/upload-artifact@v4
        with:
          name: articulation-lab-raw-ipa-source-review
          path: /tmp/articulation-source-review
          if-no-files-found: error
          retention-days: 14

      - name: Build normalized local samples
        run: |
          set -euxo pipefail
          rm -rf /tmp/articulation-voice-build /tmp/articulation-voice-work
          python3 articulation-lab/tools/build_real_voice_bundle.py \
            --source-dir /tmp/articulation-voice-src \
            --output-dir /tmp/articulation-voice-build \
            --work-dir /tmp/articulation-voice-work
          find /tmp/articulation-voice-build -type f -maxdepth 3 -print -exec ffprobe -v error -show_entries format=duration,size -of default=nw=1 {} \;

      - name: Copy provenance files
        run: |
          cp articulation-lab/data/real-voice-sources.json /tmp/articulation-voice-build/real-voice-sources.json

      - name: Bundle generated samples into staging branch
        run: |
          set -euxo pipefail
          target='articulation-lab/assets/audio/real'
          rm -rf "$target/jp_reference" "$target/ipa_reference" "$target/en_us_word_reference"
          mkdir -p "$target"
          cp -R /tmp/articulation-voice-build/jp_reference "$target/jp_reference"
          cp -R /tmp/articulation-voice-build/ipa_reference "$target/ipa_reference"
          cp -R /tmp/articulation-voice-build/en_us_word_reference "$target/en_us_word_reference"
          cp /tmp/articulation-voice-build/build-report.json "$target/build-report.json"
          cp /tmp/articulation-voice-build/real-voice-sources.json "$target/real-voice-sources.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if git diff --cached --quiet; then
            echo 'Generated audio assets already up to date.'
          else
            git commit -m 'Bundle vetted real-vowel samples'
            git fetch origin design/articulation-lab-v0.1
            git rebase origin/design/articulation-lab-v0.1
            git push origin HEAD:design/articulation-lab-v0.1
          fi

      - name: Upload review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articulation-lab-real-voice-candidates
          path: /tmp/articulation-voice-build
          if-no-files-found: error
          retention-days: 14
