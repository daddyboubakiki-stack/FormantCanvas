name: Articulation Lab real-voice bundle

on:
  workflow_dispatch:
  push:
    branches:
      - design/articulation-lab-v0.1
    paths:
      - 'articulation-lab/data/real-voice-sources.json'
      - 'articulation-lab/tools/build_real_voice_bundle.py'
      - '.github/workflows/articulation-real-voice-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tools
        run: |
          python3 --version
          ffmpeg -version | head -2

      - name: Download vetted source recordings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/articulation-voice-src
          commons='https://commons.wikimedia.org/wiki/Special:Redirect/file'
          curl -L --fail --retry 3 "$commons/Ja-A.oga" -o /tmp/articulation-voice-src/jp_a.ogg
          curl -L --fail --retry 3 "$commons/Japanese%20I.ogg" -o /tmp/articulation-voice-src/jp_i.ogg
          curl -L --fail --retry 3 "$commons/Japanese%20U.ogg" -o /tmp/articulation-voice-src/jp_u.ogg
          curl -L --fail --retry 3 "$commons/Ja-E.oga" -o /tmp/articulation-voice-src/jp_e.ogg
          curl -L --fail --retry 3 "$commons/Japanese%20O.ogg" -o /tmp/articulation-voice-src/jp_o.ogg
          curl -L --fail --retry 3 "$commons/All%20IPA%20Vowels.ogg" -o /tmp/articulation-voice-src/all_ipa.ogg
          ls -lh /tmp/articulation-voice-src

      - name: Build normalized local samples
        run: |
          set -euxo pipefail
          rm -rf /tmp/articulation-voice-build /tmp/articulation-voice-work
          python3 articulation-lab/tools/build_real_voice_bundle.py \
            --source-dir /tmp/articulation-voice-src \
            --output-dir /tmp/articulation-voice-build \
            --work-dir /tmp/articulation-voice-work
          find /tmp/articulation-voice-build -type f -maxdepth 3 -print -exec ffprobe -v error -show_entries format=duration,size -of default=nw=1 {} \;

      - name: Copy provenance files
        if: always()
        run: |
          mkdir -p /tmp/articulation-voice-build
          cp articulation-lab/data/real-voice-sources.json /tmp/articulation-voice-build/real-voice-sources.json

      - name: Upload review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articulation-lab-real-voice-candidates
          path: /tmp/articulation-voice-build
          if-no-files-found: error
          retention-days: 14
