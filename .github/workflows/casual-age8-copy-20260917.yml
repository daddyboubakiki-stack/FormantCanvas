name: Casual age-8 language layer

on:
  push:
    branches: [casual-age8-copy-20260917]
    paths:
      - '.github/workflows/casual-age8-copy-20260917.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add age-8 casual language layer
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          p=Path('index.html'); h=p.read_text(encoding='utf-8')
          if 'Casual age-8 language layer — 2026-09-17' not in h:
              patch=dedent(r'''
              <style>
              /* Casual age-8 language layer — 2026-09-17 */
              body[data-ui-mode="casual"] .selector-bar::before { content:'あそぶおと'; }
              </style>
              <script>
              /* Casual age-8 language layer — 2026-09-17 */
              (()=>{
                const b=document.body,$=s=>document.querySelector(s),id=x=>document.getElementById(x);
                const tx=(e,t)=>{if(e&&e.textContent!==t)e.textContent=t}, at=(e,n,v)=>{if(e&&e.getAttribute(n)!==v)e.setAttribute(n,v)};
                const canonLang=t=>t.replace(/^にほんご/,'日本語').replace(/^えいご/,'English');
                const casualLang=t=>t.replace(/^日本語/,'にほんご').replace(/^English/,'えいご');
                const canonVoice=t=>t.replace(/^おとな・男の人/,'成人男性').replace(/^おとな・女の人/,'成人女性').replace(/^おとな・男性/,'成人男性').replace(/^おとな・女性/,'成人女性').replace(/^こども（7〜12さい）/,'子ども（7–12歳・男女まとめ）');
                const casualVoice=t=>t.replace(/^成人男性/,'おとな・男の人').replace(/^成人女性/,'おとな・女の人').replace(/^子ども（7–12歳・男女まとめ）/,'こども（7〜12さい）');
                const canonJa=t=>{const m=t.match(/^([いえあおう])\s+\/(i|e|a|o|u)\/$/);return m?`/${m[2]}/ ${m[1]}`:t};
                const casualJa=t=>{const m=t.match(/^\/(i|e|a|o|u)\/\s+([いえあおう])$/);return m?`${m[2]} /${m[1]}/`:t};
                function opts(sel,canon,child){if(!sel)return;const c=b.dataset.uiMode==='casual';for(const o of sel.options){const base=canon(o.textContent||'');const next=c?child(base):base;if(o.textContent!==next)o.textContent=next}}
                function apply(){
                  const c=b.dataset.uiMode==='casual';
                  tx($('.brand-tagline'),c?'こえをえがくキャンバス':'声をえがくキャンバス · Draw Your Voice');
                  tx($('.title > p.casual-only'),c?'せんをかいて、こえがどうかわるかきいてみよう。':'線を描いて、声のひびきがどう変わるか聴いてみよう。');
                  tx(id('learningModeBtn'),c?'📘 まなぶ':'📘 学習');tx(id('researchModeBtn'),c?'🔬 くわしく':'🔬 研究');
                  tx($('.track-btn[data-track="F1"] .casual-only'),c?'F1 ひくめ':'F1 低め');tx($('.track-btn[data-track="F3"] .casual-only'),c?'F3 たかめ':'F3 高め');
                  tx(id('eraserBtn'),c?'けしゴム':'消しゴム');tx($('#clearCurrent .casual-only'),c?'このせんをけす':'この線を消す');tx(id('clearAll'),c?'ぜんぶけす':'全部消す');
                  tx($('label[for="voiceType"] .casual-only'),c?'だれのこえ？':'だれの声？');tx($('label[for="vowelPreset"] .casual-only'),c?'どのおと？':'どの音？');
                  tx($('.canvas-top .casual-only'),c?'色をえらんで、キャンバスにせんをかいてみよう。':'線を選んで、キャンバスを自由になぞってみよう。');
                  tx($('#canvasEmptyHint span:last-child'),c?'ここにせんをかいて、おとをきいてみよう':'ここに線をかいて、声のひびきを聴いてみよう');
                  tx(id('duration')?.closest('.setting')?.querySelector('label > span'),c?'おとの ながさ':'再生時間');
                  tx(id('f0')?.closest('.setting')?.querySelector('.casual-only'),c?'こえの たかさ':'声の高さ');
                  tx(id('stabilize')?.closest('.setting')?.querySelector('label > span'),c?'せんの なめらかさ':'手ブレ補正');
                  tx($('.casual-export-copy strong'),c?'できたおとを のこそう 🎵':'できた音をのこしておこう 🎵');
                  tx($('.casual-export-copy p'),c?'つくったおとを、スマホやパソコンにほぞんできるよ。':'いま作った音をWAVファイルでスマホやパソコンに保存できます。');
                  tx(id('casualDownloadWavBtn'),c?'🔊 おとをほぞんする':'🔊 おとを保存する');at(id('casualDownloadWavBtn'),'title',c?'つくったおとをほぞんする':'いま作った音をWAVファイルで保存');
                  tx($('.casual-tip'),c?'✏️ F1・F2・F3のせんをうごかして、▶でおとをきいてみよう。もっと知りたくなったら「📘 まなぶ」へ！':'✏️ F1・F2・F3を好きに曲げて、▶ で聴き比べよう。学習モードでは、F1/F2/F3や音のしくみも確かめられます。');
                  tx($('.site-signature'),c?'Formantasia · ちいさなこえのじっけんしつ 🧪':"Formantasia · Daddy's little phonetics lab 🧪");
                  at($('.toolbar'),'aria-label',c?'せんをかくどうぐ':'描画ツール');at($('.canvas-hero'),'aria-label',c?'こえをえがくキャンバス':'声をえがくキャンバス');
                  at(id('duration'),'aria-label',c?'おとの ながさ':'再生時間');at(id('f0'),'aria-label',c?'こえの たかさ':'声の高さ・基本周波数 F0');at(id('stabilize'),'aria-label',c?'せんの なめらかさ':'手ブレ補正');
                  const tr=id('transportBtn');if(tr){const play=tr.classList.contains('playing');at(tr,'aria-label',c?(play?'とめる':'おとをきく'):(play?'停止':'再生'));at(tr,'title',c?(play?'とめる':'おとをきく'):(play?'停止':'再生'))}
                  opts(id('presetLanguage'),canonLang,casualLang);opts(id('voiceType'),canonVoice,casualVoice);if(id('presetLanguage')?.value==='ja')opts(id('vowelPreset'),canonJa,casualJa);
                }
                new MutationObserver(rs=>{if(rs.some(r=>r.attributeName==='data-ui-mode'))apply()}).observe(b,{attributes:true,attributeFilter:['data-ui-mode']});
                for(const x of ['presetLanguage','voiceType','vowelPreset']){const e=id(x);if(e)new MutationObserver(apply).observe(e,{childList:true,subtree:true,characterData:true})}
                const tr=id('transportBtn');if(tr)new MutationObserver(apply).observe(tr,{attributes:true,attributeFilter:['class','title','aria-label']});
                id('presetLanguage')?.addEventListener('change',()=>requestAnimationFrame(apply));id('voiceType')?.addEventListener('change',()=>requestAnimationFrame(apply));apply();requestAnimationFrame(apply);
              })();
              </script>
              ''').strip()+'\n'
              h=h.replace('</body>',patch+'\n</body>',1);p.write_text(h,encoding='utf-8')
          PY
      - name: Static validation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          assert 'Casual age-8 language layer — 2026-09-17' in h and 'こども（7〜12さい）' in h and '保護者・先生の方へ' in h
          s=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,flags=re.S);Path('/tmp/age8.js').write_text(s[-1],encoding='utf-8')
          PY
          node --check /tmp/age8.js
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Browser wording test
        run: |
          python -m http.server 8000 >/tmp/age8.log 2>&1 &
          sleep 1
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait,Select
          import time
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,20)
          try:
              d.get('http://127.0.0.1:8000/');w.until(lambda x:len(x.find_elements('css selector','#vowelPreset option'))>=5);d.find_element('id','casualModeBtn').click();time.sleep(.4)
              body=d.find_element('tag name','body').text
              for s in ['こえをえがくキャンバス','📘 まなぶ','🔬 くわしく','F1 ひくめ','F3 たかめ','けしゴム','このせんをけす','ぜんぶけす','だれのこえ？','おとな・男の人','おとな・女の人','こども（7〜12さい）','どのおと？','い /i/','おとの ながさ','こえの たかさ','せんの なめらかさ','できたおとを のこそう','おとをほぞんする','保護者・先生の方へ']: assert s in body,(s,body)
              assert 'Research Preview ⓘ' not in body and d.find_element('id','transportBtn').get_attribute('aria-label')=='おとをきく'
              Select(d.find_element('id','presetLanguage')).select_by_value('en');time.sleep(.4);assert d.find_element('id','presetLanguage').find_element('css selector','option:checked').text=='えいご';print('CASUAL_ENGLISH_VOWELS',[x.text for x in d.find_elements('css selector','#vowelPreset option')])
              d.find_element('id','learningModeBtn').click();time.sleep(.3);body=d.find_element('tag name','body').text
              for s in ['声をえがくキャンバス · Draw Your Voice','📘 学習','🔬 研究','消しゴム','全部消す','再生時間','手ブレ補正']: assert s in body,(s,body)
              assert d.find_element('id','transportBtn').get_attribute('aria-label')=='再生'
              Select(d.find_element('id','presetLanguage')).select_by_value('ja');time.sleep(.3);assert any(x.text=='/i/ い' for x in d.find_elements('css selector','#vowelPreset option'));assert any(x.text.startswith('成人男性') for x in d.find_elements('css selector','#voiceType option'))
              d.find_element('id','researchModeBtn').click();time.sleep(.2);assert d.find_element('css selector','.public-preview-banner').is_displayed();print('AGE8_COPY_BROWSER_OK')
          finally:d.quit()
          PY
      - name: Commit validated index and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html && git commit -m 'Use age-8 language in casual mode [skip netlify]'
          git rm .github/workflows/casual-age8-copy-20260917.yml && git commit -m 'Remove age-8 copy helper [skip netlify]'
          git push
