name: Apply Formantasia rebrand

on:
  push:
    branches: [rebrand-formantasia]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand-formantasia

      - name: Apply approved branding changes
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Product-name / exported-artifact replacements. Internal DOM canvas names
          # and the legacy localStorage key are intentionally left untouched.
          text = text.replace('Formant Canvas', 'Formantasia')
          text = text.replace('FormantCanvas_', 'Formantasia_')
          text = text.replace('"FormantCanvas"', '"Formantasia"')
          text = text.replace("'formant_canvas.csv'", "'formantasia.csv'")
          text = text.replace("'formant_canvas.praat'", "'formantasia.praat'")

          # User-facing wording: distinguish the app/brand from the HTML canvas element.
          phrase_replacements = {
              'Canvasによるモデル区間': 'アプリによるモデル区間',
              'Canvasが補間・保持・時間方向へ表示した区間': 'アプリが補間・保持・時間方向へ表示した区間',
              '┄=Canvasモデル': '┄=アプリモデル',
              'Canvasが補間（endpoint empirical / interior modeled）': 'アプリが補間（endpoint empirical / interior modeled）',
              'VV内部はCanvas補間': 'VV内部はアプリ補間',
              '⚠ Canvasで合成': '⚠ アプリで合成',
              '◇ Canvas設定': '◇ アプリ設定',
              'をCanvasが自動計算': 'をアプリが自動計算',
              'Canvas上の表示': 'キャンバス上の表示',
              'Canvasでは同じ値を時間全体に水平表示': 'アプリでは同じ値を時間全体に水平表示',
              'Canvasがsmoothstepで滑らかに補間': 'アプリがsmoothstepで滑らかに補間',
              'Canvasがsmoothstepで生成': 'アプリがsmoothstepで生成',
              'Canvasが生成しています': 'アプリが生成しています',
              'Canvasが生成': 'アプリが生成',
              'Canvasが補間しています': 'アプリが補間しています',
              'Canvasがsmoothstepで補間': 'アプリがsmoothstepで補間',
              'Canvasが滑らかに補間': 'アプリが滑らかに補間',
              '破線はCanvasが補間・表示のために作った区間': '破線はアプリが補間・表示のために作った区間',
          }
          for old, new in phrase_replacements.items():
              text = text.replace(old, new)

          title_old = '<title>Formantasia — Play · Learn · Research (Research Preview)</title>'
          title_new = '<title>Formantasia — 声をえがくキャンバス (Research Preview)</title>'
          if title_old not in text:
              raise SystemExit('Expected browser title not found')
          text = text.replace(title_old, title_new, 1)

          h1_old = '      <h1>Formantasia</h1>'
          h1_new = '      <h1>Formantasia</h1>\n      <div class="brand-tagline">声をえがくキャンバス · Draw Your Voice</div>'
          if h1_old not in text:
              raise SystemExit('Expected main heading not found')
          text = text.replace(h1_old, h1_new, 1)

          css_anchor = '  .title h1 { margin:0; font-size: clamp(24px,4vw,38px); letter-spacing:-.04em; }'
          css_insert = css_anchor + '\n  .brand-tagline { margin-top:4px; color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.01em; }'
          if css_anchor not in text:
              raise SystemExit('Expected title CSS anchor not found')
          text = text.replace(css_anchor, css_insert, 1)

          footer_css_anchor = '  .research-note { margin-top:10px; padding:10px 12px; border-radius:12px; background:#f6f8fc; color:#5d6575; }'
          footer_css_insert = footer_css_anchor + '\n  .site-signature { margin:18px 0 8px; text-align:center; color:#8a91a0; font-size:11px; letter-spacing:.02em; }'
          if footer_css_anchor not in text:
              raise SystemExit('Expected footer CSS anchor not found')
          text = text.replace(footer_css_anchor, footer_css_insert, 1)

          footer_anchor = '  </details>\n</div>\n\n<script>'
          footer_insert = '  </details>\n  <footer class="site-signature">Formantasia · Daddy\'s little phonetics lab 🧪</footer>\n</div>\n\n<script>'
          if footer_anchor not in text:
              raise SystemExit('Expected footer insertion point not found')
          text = text.replace(footer_anchor, footer_insert, 1)

          # Compatibility guard: this old key deliberately survives the rebrand.
          if "localStorage.setItem('formantCanvasUiMode'" not in text or "localStorage.getItem('formantCanvasUiMode'" not in text:
              raise SystemExit('Compatibility localStorage key was unexpectedly changed')

          # Visible old product-name/export patterns should be gone.
          for stale in ('Formant Canvas', 'FormantCanvas_', 'formant_canvas.csv', 'formant_canvas.praat'):
              if stale in text:
                  raise SystemExit(f'Stale branding remains: {stale}')

          p.write_text(text, encoding='utf-8')

      - name: Commit rebrand
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebrand app as Formantasia"
          git push origin HEAD:rebrand-formantasia
