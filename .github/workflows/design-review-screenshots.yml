name: Design review screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/design-review-screenshots.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Capture screenshots
        run: |
          python -m http.server 8000 >/tmp/formantasia-review.log 2>&1 &
          sleep 1
          mkdir -p screenshots
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          import time

          def make_driver(width,height):
              opts=Options()
              opts.add_argument('--headless=new')
              opts.add_argument('--no-sandbox')
              opts.add_argument('--disable-dev-shm-usage')
              opts.add_argument(f'--window-size={width},{height}')
              return webdriver.Chrome(options=opts)

          d=make_driver(1440,1100)
          wait=WebDriverWait(d,20)
          try:
              d.get('http://127.0.0.1:8000/')
              wait.until(lambda x: len(x.find_elements('css selector','#vowelPreset option')) >= 5)
              time.sleep(.5)
              d.save_screenshot('screenshots/desktop-casual.png')
              d.find_element('id','learningModeBtn').click(); time.sleep(.4)
              d.save_screenshot('screenshots/desktop-learning.png')
              d.find_element('id','researchModeBtn').click(); time.sleep(.4)
              d.save_screenshot('screenshots/desktop-research.png')
          finally:
              d.quit()

          m=make_driver(390,844)
          wait=WebDriverWait(m,20)
          try:
              m.get('http://127.0.0.1:8000/')
              wait.until(lambda x: len(x.find_elements('css selector','#vowelPreset option')) >= 5)
              m.find_element('id','casualModeBtn').click(); time.sleep(.4)
              m.save_screenshot('screenshots/mobile-casual.png')
              m.find_element('id','clearAll').click(); time.sleep(.4)
              m.save_screenshot('screenshots/mobile-empty.png')
          finally:
              m.quit()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: formantasia-design-review
          path: screenshots/
          if-no-files-found: error
      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/design-review-screenshots.yml
          git commit -m 'Remove design review screenshot helper [skip netlify]'
          git push
