name: Integrate Yazawa-Kondo UI

on:
  push:
    branches: [feat/yazawa-kondo-ui-integration]
    paths:
      - 'tools/integrate_yazawa_kondo_ui.py'
      - '.github/workflows/integrate-yazawa-kondo-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import generated Yazawa-Kondo aggregate data
        run: |
          git fetch origin feat/yazawa-kondo-adult-presets:refs/remotes/origin/feat/yazawa-kondo-adult-presets --depth=1
          git checkout origin/feat/yazawa-kondo-adult-presets -- data/yazawa_kondo_2019_adult_presets.json data/yazawa_kondo_2019_adult_summary.csv
      - name: Patch Formantasia UI
        run: python tools/integrate_yazawa_kondo_ui.py
      - name: Validate data and JavaScript syntax
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          data=json.loads(Path('data/yazawa_kondo_2019_adult_presets.json').read_text())
          assert len(data['presets'])==40
          combos={(p['sex'],p['context_label'],p['length'],p['vowel']) for p in data['presets']}
          assert len(combos)==40
          html=Path('index.html').read_text()
          for needle in ['YK2019_PRESETS','applyYazawaKondoPreset','単独語・短（Yazawa–Kondo）','文中・長（Yazawa–Kondo）','loadYazawaKondoData();']:
              assert needle in html, needle
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S)
          Path('/tmp/formantasia-last-script.js').write_text(scripts[-1])
          print('DATA_PRESETS',len(data['presets']))
          print('UNIQUE_CONDITIONS',len(combos))
          PY
          node --check /tmp/formantasia-last-script.js
      - name: Commit integration result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/yazawa_kondo_2019_adult_presets.json data/yazawa_kondo_2019_adult_summary.csv
          if git diff --cached --quiet; then
            echo 'Integration result unchanged.'
          else
            git commit -m 'Integrate Yazawa-Kondo adult presets into Formantasia UI'
            git push
          fi
