name: Build Hillenbrand trajectory data

on:
  push:
    branches:
      - feat/hillenbrand-trajectories
    paths:
      - tools/build_hillenbrand.py
      - .github/workflows/build-hillenbrand.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build trajectory means
        run: python tools/build_hillenbrand.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hillenbrand_1995_trajectories.json
          if git diff --cached --quiet; then
            echo "No generated-data changes."
            exit 0
          fi
          git commit -m "Generate Hillenbrand 1995 trajectory means"
          git push origin HEAD:${GITHUB_REF_NAME}
