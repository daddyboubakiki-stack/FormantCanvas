name: Accessibility quick fixes

on:
  push:
    branches: [main]
    paths:
      - 'tools/accessibility_quick_fixes.py'
      - '.github/workflows/accessibility-quick-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply accessibility patch
        run: python tools/accessibility_quick_fixes.py

      - name: Validate accessibility quick fixes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html=Path('index.html').read_text(encoding='utf-8')

          viewport=re.search(r'<meta name="viewport" content="([^"]+)"',html)
          assert viewport, 'viewport meta missing'
          content=viewport.group(1)
          assert 'user-scalable=no' not in content
          assert 'maximum-scale=1' not in content

          for control_id in ['duration','f0','maxHz','bandwidthMode','q','stabilize']:
              m=re.search(rf'<(?:input|select)[^>]*id="{control_id}"[^>]*>',html)
              assert m, f'{control_id} missing'
              assert 'aria-label=' in m.group(0), f'{control_id} has no accessible name'

          assert '--muted: #667085;' in html
          assert 'outline:3px solid #1d4ed8' in html
          assert '.track-btn[data-track="F1"].active { background:#c92f4e; }' in html
          assert '.track-btn[data-track="F2"].active { background:#2563eb; }' in html
          assert '.track-btn[data-track="F3"].active { background:#7c3aed; }' in html
          assert 'aria-label="描画ツール"' in html
          assert 'aria-pressed="true"' in html

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S)
          Path('/tmp/formantasia.js').write_text(scripts[-1],encoding='utf-8')
          print('STATIC_A11Y_CHECKS_OK')
          PY
          node --check /tmp/formantasia.js

      - name: Install Selenium
        run: python -m pip install --quiet selenium

      - name: Browser accessibility smoke test
        run: |
          python -m http.server 8000 >/tmp/formantasia-server.log 2>&1 &
          sleep 1
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1280,1000')
          opts.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          wait=WebDriverWait(driver,20)
          try:
              driver.get('http://127.0.0.1:8000/')
              wait.until(lambda d: len(d.find_elements('css selector','#vowelPreset option'))>=5)

              viewport=driver.find_element('css selector','meta[name="viewport"]').get_attribute('content')
              assert 'user-scalable=no' not in viewport
              assert 'maximum-scale=1' not in viewport

              expected_labels={
                  'duration':'再生時間',
                  'f0':'声の高さ・基本周波数 F0',
                  'maxHz':'最大周波数',
                  'bandwidthMode':'帯域幅モード',
                  'q':'Manual Q',
                  'stabilize':'手ブレ補正',
              }
              for control_id,label in expected_labels.items():
                  assert driver.find_element('id',control_id).get_attribute('aria-label')==label

              f1=driver.find_element('css selector','.track-btn[data-track="F1"]')
              f2=driver.find_element('css selector','.track-btn[data-track="F2"]')
              f3=driver.find_element('css selector','.track-btn[data-track="F3"]')
              eraser=driver.find_element('id','eraserBtn')
              assert f1.get_attribute('aria-pressed')=='true'
              assert f2.get_attribute('aria-pressed')=='false'
              assert f3.get_attribute('aria-pressed')=='false'
              assert eraser.get_attribute('aria-pressed')=='false'

              f2.click()
              assert f1.get_attribute('aria-pressed')=='false'
              assert f2.get_attribute('aria-pressed')=='true'
              assert eraser.get_attribute('aria-pressed')=='false'

              eraser.click()
              assert all(x.get_attribute('aria-pressed')=='false' for x in (f1,f2,f3))
              assert eraser.get_attribute('aria-pressed')=='true'

              driver.find_element('id','learningModeBtn').click()
              topic_f1=driver.find_element('css selector','.learning-topic[data-learn-topic="f1"]')
              topic_f2=driver.find_element('css selector','.learning-topic[data-learn-topic="f2"]')
              topic_f2.click()
              assert topic_f1.get_attribute('aria-pressed')=='false'
              assert topic_f2.get_attribute('aria-pressed')=='true'

              severe=[x for x in driver.get_log('browser') if x.get('level')=='SEVERE' and 'favicon.ico' not in x.get('message','')]
              print('FINAL_SEVERE_BROWSER_LOGS',severe)
              assert not severe, severe
              print('ACCESSIBILITY_QUICK_FIXES_OK')
          finally:
              driver.quit()
          PY

      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No generated index changes.'
          else
            git commit -m 'Improve basic accessibility'
            git push
          fi
