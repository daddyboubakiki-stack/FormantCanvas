name: Update glossary Q source

on:
  push:
    branches: [feat/beginner-vowel-compare-ui]
    paths:
      - 'tools/update_glossary_q_source.py'
      - '.github/workflows/update-glossary-q-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Q source
        run: python tools/update_glossary_q_source.py
      - name: Validate
        run: |
          grep -q 'OpenStax University Physics — Resonance and Q' index.html
          grep -q 'openstax.org/books/university-physics-volume-2/pages/15-5-resonance-in-an-ac-circuit' index.html
          grep -q 'OpenStax University Physics — Resonance and Q' tools/expand_learning_glossary.py
      - name: Commit source update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/expand_learning_glossary.py
          if git diff --cached --quiet; then
            echo 'No source changes.'
          else
            git commit -m 'Use stable Q-factor glossary reference'
            git push
          fi
